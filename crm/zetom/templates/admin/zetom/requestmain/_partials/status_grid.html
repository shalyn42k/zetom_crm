{% load i18n %}
<section class="rm-card rm-card--collapsible" aria-labelledby="rm-status-heading" id="status-grid" x-data="{ open: $persist(true).as('rm-status-{{ request.user.id }}-{{ original.pk }}') }">
  <header class="rm-card__header rm-card__toggle" role="button" tabindex="0" :aria-expanded="open" @click="open = !open" @keydown.enter.prevent="open = !open" @keydown.space.prevent="open = !open">
    <h2 id="rm-status-heading" class="rm-card__title">{% trans "Status" %}</h2>
    <svg class="rm-card__chevron" :class="{ 'rm-card__chevron--open': open }" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
  </header>

  <div x-show="open" x-cloak>
    <div class="rm-status-grid" role="radiogroup" aria-label='{% trans "Request status" %}'>
      {% for value, label in status_choices %}
        <label class="rm-status-btn rm-status-btn--{{ value }}{% if not can_change_request_status %} is-disabled{% endif %}">
          <input type="radio"
                 name="new_status"
                 value="{{ value }}"
                 class="rm-status-btn__input"
                 {% if original.status == value %}checked{% endif %}
                 {% if not can_change_request_status %}disabled aria-disabled="true"{% endif %}>
          <span class="rm-status-btn__icon" aria-hidden="true">
            <span class="rm-dot rm-dot--{{ value }}"></span>
            <svg class="rm-status-btn__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12l5 5L20 7"/>
            </svg>
          </span>
          {{ label }}
        </label>
      {% endfor %}
    </div>

    <button type="submit"
            formaction='{% url "admin:zetom_requestmain_apply_status" original.pk %}'
            formmethod="post"
            formnovalidate
            class="rm-btn rm-btn--primary rm-btn--block"
            {% if not can_change_request_status %}disabled aria-disabled="true" title='{% trans "You don't have permission to change status." %}'{% endif %}>
      {% trans "Apply" %}
    </button>

    {% if not can_change_request_status %}
      <div class="rm-status-help">
        <p>{% trans "You don't have permission to change status." %}</p>
      </div>
    {% endif %}
  </div>
</section>
