{% extends "admin/change_form.html" %}
{% load i18n %}

{% block submit_buttons_bottom %}
  <div id="submit-row" class="relative lg:sticky lg:bottom-0 z-40">
    <div class="backdrop-blur-xs bg-white/80 rounded-b-default pb-4 px-4 dark:bg-base-900/80 lg:border-t lg:border-base-200 relative lg:py-0 dark:border-base-800">
      <div class="flex flex-col-reverse gap-3 items-center mx-auto lg:flex-row-reverse container lg:h-[64px]">
        <form method="post" action='{% url "admin:zetom_cancelledvalidationrequest_restore" original.pk %}' class="w-full lg:w-auto">
          {% csrf_token %}
          <button type="submit" class="w-full lg:w-auto font-medium inline-flex items-center gap-1 rounded-default justify-center cursor-pointer px-3 py-2 bg-primary-600 border border-primary-600 text-white hover:bg-primary-600/80">
            <span class="material-symbols-outlined -ml-0.5">restore</span>
            {% trans "Restore to Validation Window" %}
          </button>
        </form>
      </div>
    </div>
  </div>
{% endblock submit_buttons_bottom %}
