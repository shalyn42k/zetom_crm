{% extends "unfold/layouts/base.html" %}
{% load i18n %}

{% block content %}
<div class="p-6 max-w-2xl mx-auto">

    <h1 class="text-2xl font-bold mb-6">{% trans "My profile" %}</h1>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.non_field_errors }}

        {% for field in form %}
        <div>
            <label class="block mb-1 font-semibold">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <p class="text-red-400 text-sm">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}

        <div class="flex justify-end">
            <button class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded">
                {% trans "Save" %}
            </button>
        </div>
    </form>

</div>
{% endblock content %}
