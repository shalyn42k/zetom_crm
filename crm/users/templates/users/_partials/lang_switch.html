{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
{% get_available_languages as LANGUAGES %}
{% get_language_info_list for LANGUAGES as languages %}

<div class="flex gap-1 justify-end mb-6">
  {% for language in languages %}
    <form action="{% url 'set_language' %}" method="post">
      {% csrf_token %}
      <input name="next" type="hidden" value="{{ request.path }}">
      <input name="language" type="hidden" value="{{ language.code }}">
      <button type="submit"
              class="font-medium px-2.5 py-1 rounded-default text-xs uppercase
                     {% if language.code == LANGUAGE_CODE %}
                       bg-primary-600 text-white
                     {% else %}
                       bg-white border border-base-300 text-font-important-light hover:bg-base-100 dark:bg-base-800 dark:border-base-600 dark:text-font-important-dark dark:hover:bg-base-700
                     {% endif %}">
        {{ language.code }}
      </button>
    </form>
  {% endfor %}
</div>
