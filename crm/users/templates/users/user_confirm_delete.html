{% extends "unfold/layouts/base.html" %}
{% load i18n %}

{% block content %}
<div class="p-6 max-w-xl mx-auto">

    <h1 class="text-2xl font-bold mb-6 text-red-400">{% trans "Delete user" %}</h1>

    <p class="mb-6">{% blocktrans with username=user.username %}Are you sure you want to delete user <strong>{{ username }}</strong>?{% endblocktrans %}</p>

    <form method="post" class="flex gap-4">
        {% csrf_token %}
        <button class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded">
            {% trans "Delete" %}
        </button>
        <a href="{% url 'user_list' %}" class="px-4 py-2 bg-gray-700 hover:bg-gray-800 text-white rounded">
            {% trans "Cancel" %}
        </a>
    </form>

</div>
{% endblock content %}
