{% extends "admin/change_form.html" %}
{% load i18n admin_urls %}

{% block extrahead %}
{{ block.super }}
<style>
  .request-main-dashboard {
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr);
    gap: 1.5rem;
    align-items: start;
  }

  .request-main-dashboard__panel {
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 0.75rem;
    padding: 1rem;
    background: rgba(15, 23, 42, 0.35);
  }

  .request-main-dashboard__panel h3 {
    margin: 0 0 0.75rem;
    font-weight: 600;
  }

  .request-main-dashboard__controls {
    display: grid;
    gap: 0.75rem;
  }

  .request-main-dashboard__controls select,
  .request-main-dashboard__controls button {
    width: 100%;
  }

  .request-main-dashboard__email-note {
    margin-top: 0.75rem;
    font-size: 0.9rem;
    color: #86efac;
    display: none;
  }

  @media (max-width: 1024px) {
    .request-main-dashboard {
      grid-template-columns: 1fr;
    }
  }
</style>
{% endblock %}

{% block field_sets %}
<div class="request-main-dashboard">
  <section>
    {{ block.super }}
  </section>

  <aside>
    <div class="request-main-dashboard__panel">
      <h3>{% trans "Oferta" %}</h3>
      <div class="request-main-dashboard__controls">
        <select id="id_oferta_redirect">
          <option value="">{% trans "Select oferta" %}</option>
          {% if original %}
            {% for oferta in original.oferta_set.all %}
              <option value="{% url 'admin:zetom_oferta_change' oferta.pk %}">
                #{{ oferta.pk }} — {{ oferta.company_name|default:_('No company name') }}
              </option>
            {% empty %}
              <option value="" disabled>{% trans "No oferta linked to this RequestMain" %}</option>
            {% endfor %}
          {% else %}
            <option value="" disabled>{% trans "Save RequestMain first" %}</option>
          {% endif %}
        </select>

        <button type="button" class="button default" id="open-oferta-btn">
          {% trans "Open" %}
        </button>
      </div>
    </div>
  </aside>
</div>
{% endblock %}

{% block submit_buttons_bottom %}
{{ block.super }}
<div class="submit-row">
  <button type="button" class="button default" id="submit-email-btn" style="float: right;">
    Submit email
  </button>
  <span class="request-main-dashboard__email-note" id="submit-email-note">Сообщение отправлено</span>
</div>
<script>
  (function () {
    const ofertaSelect = document.getElementById('id_oferta_redirect');
    const openOfertaBtn = document.getElementById('open-oferta-btn');
    const emailButton = document.getElementById('submit-email-btn');
    const emailNote = document.getElementById('submit-email-note');

    document.querySelectorAll('[name="_addanother"]').forEach(function (element) {
      const wrapper = element.closest('button, a, label, .submit-row > *') || element;
      wrapper.style.display = 'none';
    });

    if (emailButton && emailNote) {
      emailButton.addEventListener('click', function () {
        emailNote.style.display = 'inline-block';
      });
    }

    if (openOfertaBtn && ofertaSelect) {
      openOfertaBtn.addEventListener('click', function () {
        if (ofertaSelect.value) {
          window.location.href = ofertaSelect.value;
        }
      });
    }
  })();
</script>
{% endblock %}
