services:
  db:
    image: postgres:16.4
    container_name: zetom-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: zetom-web
    restart: unless-stopped
    env_file: .env
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: .
    container_name: zetom-scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      SKIP_DJANGO_INIT: "1"
      FOLLOWUP_REMINDERS_INTERVAL_SECONDS: ${FOLLOWUP_REMINDERS_INTERVAL_SECONDS:-60}
      DB_HOST: db
      DB_PORT: 5432
    command: ["./docker/followup_scheduler.sh"]
    depends_on:
      db:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: zetom-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web

volumes:
  postgres_data_prod:
